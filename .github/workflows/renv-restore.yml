name: renv-restore audit

# Proves the committed renv.lock actually restores from scratch on Linux and that
# the restored environment passes the tests + airway validation. This is the
# "clean-checkout reproducibility" check. It is expensive (compiles the stack), so
# it runs weekly and on demand rather than on every push (the per-push CI uses the
# container image instead).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

env:
  RENV_PATHS_CACHE: ~/.cache/R/renv

jobs:
  restore:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_18
    steps:
      - uses: actions/checkout@v4

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ hashFiles('renv.lock') }}
          restore-keys: renv-

      # Restore the locked packages into an EXPLICIT library, then run tests +
      # validation against that library. We deliberately do NOT call
      # renv::activate() (which would write renv/activate.R and make later Rscript
      # calls auto-switch to a differently-computed project library) and we pass
      # --no-init-file so the committed .Rprofile can't re-activate a different lib.
      - name: Restore exactly from renv.lock
        run: |
          mkdir -p ci-lib
          R -q -e 'install.packages("renv", repos="https://cloud.r-project.org"); renv::restore(lockfile="renv.lock", library="ci-lib", prompt=FALSE)'

      - name: Unit tests on the restored library
        env:
          R_LIBS_USER: ci-lib
        run: Rscript --no-init-file -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Airway validation on the restored library
        env:
          R_LIBS_USER: ci-lib
        run: Rscript --no-init-file run_pipeline.R --validate --config config/config.example.yaml --outdir results/airway_validation
